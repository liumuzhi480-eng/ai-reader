name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 自动解压代码并展示在仓库中
        run: |
          unzip -o *.zip || true
          PROJECT_ROOT=$(dirname "$(find . -name "package.json" | head -n 1)")
          if [ "$PROJECT_ROOT" != "." ] && [ -n "$PROJECT_ROOT" ]; then
            mv "$PROJECT_ROOT"/* . || true
            mv "$PROJECT_ROOT"/.* . 2>/dev/null || true
          fi
          rm -f *.zip package-lock.json yarn.lock pnpm-lock.yaml

      - name: 配置环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 安装依赖 (已修复 Capacitor 核心依赖)
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/status-bar localforage --legacy-peer-deps

      - name: 编译前端并突破沉浸式安全区
        env:
          CI: false
        run: |
          npx vite build --outDir android_dist --emptyOutDir
          cd android_dist
          sed -i 's/viewport".*/viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">/g' index.html || true
          sed -i '/<\/head>/i \    <style> html, body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); background-color: #ffffff; } </style>' index.html || true
          cd ..

      - name: 配置 Capacitor
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.aireader.app",
            "appName": "AI书摘阅读器",
            "webDir": "android_dist",
            "bundledWebRuntime": false,
            "plugins": { "StatusBar": { "overlaysWebView": true } }
          }
          EOF

      - name: 生成原生工程并强制透明导航栏
        run: |
          npx cap add android || true
          npx cap sync android
          
          cat << 'EOF' >> android/build.gradle
          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF
          
          sed -i '/<style name="AppTheme"/a \        <item name="android:windowTranslucentStatus">true</item>\n        <item name="android:windowTranslucentNavigation">true</item>\n        <item name="android:windowDrawsSystemBarBackgrounds">true</item>' android/app/src/main/res/values/styles.xml || true

      - name: 编译 APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8"

      - name: 输出产物
        uses: actions/upload-artifact@v4
        with:
          name: AI-Reader-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
