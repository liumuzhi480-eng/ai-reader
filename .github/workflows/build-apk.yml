name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 自动解压与目录精准规整
        run: |
          unzip -o *.zip || true
          # 精确找到包含前端 package.json 的根目录，并将所有代码平铺提取出来
          PROJECT_ROOT=$(dirname "$(find . -name "package.json" | head -n 1)")
          if [ "$PROJECT_ROOT" != "." ] && [ -n "$PROJECT_ROOT" ]; then
            mv "$PROJECT_ROOT"/* . || true
            mv "$PROJECT_ROOT"/.* . 2>/dev/null || true
          fi
          rm -f package-lock.json yarn.lock pnpm-lock.yaml

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 配置 Java 环境
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 安装依赖
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: 强制编译前端界面至指定目录
        env:
          CI: false
        run: |
          # 利用 --outDir 强行无视任何内设路径，把生成的网页直接砸进 android_dist 文件夹
          npx vite build --outDir android_dist --emptyOutDir

      - name: 生成精准定位的 Capacitor 配置
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.aireader.app",
            "appName": "AI书摘阅读器",
            "webDir": "android_dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: 初始化并打包 Android 原生工程
        run: |
          npx cap add android || true
          # Capacitor 会精准读取刚刚生成的 android_dist 网页文件并塞入 App
          npx cap sync android
          
          # 解决 Kotlin 原生库冲突
          cat << 'EOF' >> android/build.gradle
          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

      - name: 编译最终版 APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8"

      - name: 输出 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: AI-Reader-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
