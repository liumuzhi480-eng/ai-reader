name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 自动解压项目文件
        run: |
          unzip -o *.zip
          if [ -d "app" ]; then
            cp -r app/. .
          fi

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 自动生成 Capacitor 配置
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.aireader.app",
            "appName": "AI书摘阅读器",
            "webDir": "dist"
          }
          EOF

      - name: 安装依赖与构建前端
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npm run build

      - name: 生成 Android 工程并同步
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 编译 Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 上传 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: AI-Reader-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
